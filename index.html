<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- Locked Viewport: Prevents user scaling, zooming, and fits mobile screen cutouts -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>Counter PWA</title>
    <meta name="theme-color" content="#4F46E5" />

    <!-- Link to external Manifest file -->
    <link rel="manifest" href="/manifest.json" />

    <!-- iOS Safari requires a PNG icon -->
    <link rel="apple-touch-icon" href="/icon-192.png" />

    <!-- Native Standalone Display Mode for iOS -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="Counter" />

    <style>
      /* Complete Page Lockdown Styles */
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden; /* Disables scrolling */
        position: fixed; /* Prevents iOS rubber-band scroll bounce */
        font-family:
          system-ui,
          -apple-system,
          sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background-color: #f3f4f6;

        /* Eliminates tap delays and double-tap zoom */
        touch-action: manipulation;

        /* Prevents native text selection and long-press menus */
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
      }

      .card {
        background: white;
        padding: 2.5rem;
        border-radius: 1rem;
        box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        text-align: center;
        width: 80%;
        max-width: 300px;
      }

      .count {
        font-size: 5rem;
        font-weight: 800;
        color: #1f2937;
        margin: 1rem 0;
      }

      button {
        background-color: #4f46e5;
        color: white;
        border: none;
        padding: 1rem 2rem;
        font-size: 1.25rem;
        font-weight: 600;
        border-radius: 0.5rem;
        cursor: pointer;
        width: 100%;
        transition:
          background-color 0.15s,
          transform 0.1s;

        /* Removes highlight box on tap for mobile browsers */
        -webkit-tap-highlight-color: transparent;
      }

      button:active {
        transform: scale(0.96);
        background-color: #4338ca;
      }

      /* Custom Install Banner Overlay */
      #install-banner {
        display: none;
        position: fixed;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        background: #1f2937;
        color: white;
        padding: 1rem 1.5rem;
        border-radius: 0.75rem;
        box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
        align-items: center;
        gap: 1rem;
        z-index: 9999;
        width: calc(100% - 3rem);
        max-width: 350px;
        justify-content: space-between;
      }

      #install-banner span {
        font-size: 0.9rem;
      }

      #install-btn {
        width: auto;
        padding: 0.5rem 1rem;
        font-size: 0.85rem;
        background-color: #10b981;
      }

      #install-btn:active {
        background-color: #059669;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="count" id="count">0</div>
      <button id="counter-btn">Click Me</button>
    </div>

    <!-- Install Popup -->
    <div id="install-banner">
      <span>Install app to your device?</span>
      <button id="install-btn">Install</button>
    </div>

    <script>
      // 1. Counter Logic
      let count = 0;
      const countDisplay = document.getElementById("count");
      const counterBtn = document.getElementById("counter-btn");

      counterBtn.addEventListener("click", () => {
        count++;
        countDisplay.textContent = count;
      });

      // 2. Gesture & Double-Tap Prevention Logic
      document.addEventListener("gesturestart", (e) => e.preventDefault(), {
        passive: false,
      });
      document.addEventListener("gesturechange", (e) => e.preventDefault(), {
        passive: false,
      });
      document.addEventListener("gestureend", (e) => e.preventDefault(), {
        passive: false,
      });

      let lastTouchEnd = 0;
      document.addEventListener(
        "touchend",
        (e) => {
          const now = Date.now();
          if (now - lastTouchEnd <= 300) {
            e.preventDefault();
          }
          lastTouchEnd = now;
        },
        { passive: false },
      );

      // 3. Service Worker Registration
      if ("serviceWorker" in navigator) {
        const swCode = `
        const CACHE = 'counter-v3';
        self.addEventListener('install', e => {
          e.waitUntil(caches.open(CACHE).then(c => c.addAll(['/'])));
        });
        self.addEventListener('fetch', e => {
          e.respondWith(caches.match(e.request).then(res => res || fetch(e.request)));
        });
      `;
        const blob = new Blob([swCode], { type: "application/javascript" });
        navigator.serviceWorker
          .register(URL.createObjectURL(blob))
          .catch((err) => console.error("ServiceWorker error:", err));
      }

      // 4. Custom Install Banner Prompt (Android Chrome/Edge)
      let deferredPrompt;
      const installBanner = document.getElementById("install-banner");
      const installBtn = document.getElementById("install-btn");

      window.addEventListener("beforeinstallprompt", (e) => {
        e.preventDefault();
        deferredPrompt = e;
        installBanner.style.display = "flex";
      });

      installBtn.addEventListener("click", async () => {
        if (deferredPrompt) {
          deferredPrompt.prompt();
          const { outcome } = await deferredPrompt.userChoice;
          if (outcome === "accepted") {
            installBanner.style.display = "none";
          }
          deferredPrompt = null;
        }
      });

      window.addEventListener("appinstalled", () => {
        installBanner.style.display = "none";
      });
    </script>
  </body>
</html>
